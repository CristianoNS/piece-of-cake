name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:DebugType=none -o publish
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath PieceOfCake-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PieceOfCake-win-x64
          path: PieceOfCake-win-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            PieceOfCake-win-x64.zip
            publish/PieceOfCake.dll
